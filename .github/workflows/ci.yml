# Линтер и тесты на каждый push и pull request.
# На main заготовки: нерешённые задачи помечаются skipped, CI зелёный.
# Решённые задачи должны проходить, иначе CI красный.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests and progress
        run: pytest -rN
