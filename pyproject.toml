[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]  # примеры кода в вопросах оформлены вручную

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# Заготовки: аргументы и импорты понадобятся в твоём решении
"{data_structures,algorithms,python_core,ml_basics}/*.py" = ["F401"]
